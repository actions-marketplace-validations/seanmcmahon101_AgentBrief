name: AgentBrief check
description: Fail CI when AGENTS.md, CLAUDE.md, Cursor or Copilot instructions drift from the repository.
author: Sean McMahon
branding:
  icon: check-circle
  color: green
inputs:
  args:
    description: Arguments passed to agentbrief (default runs the drift check).
    default: check
  version:
    description: Release tag, main, latest, or full commit SHA to install. Defaults to the action ref.
    default: ""
  working-directory:
    description: Repository root to check.
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Install agentbrief
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        v="${VERSION:-${ACTION_REF:-latest}}"
        if [[ ! "$v" =~ ^(v[0-9][0-9A-Za-z.+-]*|main|latest|[0-9a-fA-F]{40})$ ]]; then
          echo "Unsupported AgentBrief version: use a release tag, main, latest, or full commit SHA." >&2
          exit 1
        fi
        # Mutable branch lookups may lag in the module proxy. Immutable tags
        # and commit SHAs retain normal checksum/proxy behavior.
        if [[ "$v" == main ]]; then export GOPROXY=direct; fi
        go install "github.com/seanmcmahon101/AgentBrief/cmd/agentbrief@$v"
    - name: Run agentbrief
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: agentbrief ${{ inputs.args }}
